<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parent Portal – Maths Progress</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--tx:#17212f;--mu:#667085;--bd:#e2e8f0;--ac:#1d4ed8;--ok:#15803d;--bad:#b91c1c}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--tx:#e5e7eb;--mu:#94a3b8;--bd:#334155;--ac:#60a5fa;--ok:#4ade80;--bad:#f87171}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px}.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:0 0 8px}.mu{color:var(--mu);font-size:13px}
input{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;font-size:16px;background:var(--bg);color:var(--tx);margin:6px 0 12px}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:600;font-size:15px;cursor:pointer}button.g{background:var(--bd);color:var(--tx)}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.tabs button.on{background:var(--ac);color:#fff}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.chip{flex:1;min-width:100px;background:var(--bg);border-radius:12px;padding:10px;text-align:center}.chip b{display:block;font-size:20px}
.t{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}th{color:var(--mu);font-weight:600;font-size:12px}
.err{color:var(--bad);min-height:20px}.ok{color:var(--ok)}.bad{color:var(--bad)}footer{text-align:center;color:var(--mu);font-size:12px;padding:10px}
@media print{.noprint{display:none}body{background:#fff;color:#000}}
</style></head><body><div class="w">
<div id="login" class="c"><h1>📘 Parent Portal</h1><div class="mu" style="margin-bottom:12px">View your child’s Maths progress report.</div>
<label>SIS number<input id="sis" inputmode="numeric" autocomplete="off"></label><label>Access code<input id="code" autocomplete="off" autocapitalize="characters" placeholder="6 characters, given by the teacher"></label>
<button id="go">View report</button><div class="err" id="err"></div></div>
<div id="rep" hidden></div>
<footer>© Manish Rawat</footer></div>
<script>
const $=id=>document.getElementById(id),te=new TextEncoder(),td=new TextDecoder();
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=d=>{if(!d)return '';const m=String(d).match(/^(\d{4})-(\d\d)-(\d\d)/);return m?m[3]+'/'+m[2]+'/'+m[1]:esc(d)};
async function open(sis,code){
 const r=await fetch('parent-data.json',{cache:'no-store'});if(!r.ok)throw new Error('nodata');const B=await r.json();
 const h=await crypto.subtle.digest('SHA-256',te.encode(sis+':'+B.k)),id=[...new Uint8Array(h)].slice(0,12).map(x=>x.toString(16).padStart(2,'0')).join(''),e=B.d[id];
 if(!e)throw new Error('bad');
 const km=await crypto.subtle.importKey('raw',te.encode(sis+':'+code),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(e.s),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(e.i)},key,ub(e.c));
 return{d:JSON.parse(td.decode(pt)),u:B.u};
}
function term(R){let h='';const ch=[];
 if(R.fa!=null&&R.fa!=='')ch.push(['FA average',R.fa+'%']);
 if(R.at){const t=R.at.P+R.at.A+R.at.L;ch.push(['Attendance',Math.round((R.at.P+R.at.L)/t*100)+'%'])}
 if(R.b)ch.push(['Behaviour',R.b.s+'/100']);
 if(ch.length)h+='<div class="chips">'+ch.map(c=>`<div class="chip"><b>${c[1]}</b><span class="mu">${c[0]}</span></div>`).join('')+'</div>';
 if(R.m&&R.m.length){const g={};R.m.forEach(x=>(g[x.c||'Assessments']=g[x.c||'Assessments']||[]).push(x));
  h+='<div class="c"><h2>Assessment marks</h2>'+Object.keys(g).map(k=>`<div class="t"><table><tr><th colspan="3">${esc(k)}</th></tr>${g[k].map(x=>`<tr><td>${esc(x.a)}</td><td>${x.x?'Absent':x.p==null?'–':x.p.toFixed(1)+'%'+(x.r!=null&&x.o?` <span class="mu">(${esc(x.r)}/${esc(x.o)})</span>`:'')}</td><td class="mu">${fd(x.d)}</td></tr>`).join('')}</table></div>`).join('')+'</div>'}
 if(R.w&&R.w.length)h+=`<div class="c"><h2>Classwork &amp; homework</h2><div class="t"><table><tr><th>Task</th><th>Date</th><th>Status</th><th>Mark</th></tr>${R.w.map(x=>`<tr><td><b>${esc(x.k)}</b> – ${esc(x.t)}${x.tp?`<br><span class="mu">${esc(x.tp)}</span>`:''}${x.cm?`<br><span class="mu">${esc(x.cm)}</span>`:''}</td><td class="mu">${fd(x.d)}</td><td class="${/missing|not done/i.test(x.st)?'bad':''}">${esc(x.st)}</td><td>${x.mk==null?'–':esc(x.mk)+(x.mx?'/'+esc(x.mx):'')}</td></tr>`).join('')}</table></div></div>`;
 if(R.at)h+=`<div class="c"><h2>Attendance</h2><div>Present: <b>${R.at.P}</b> · Late: <b>${R.at.L}</b> · Absent: <b>${R.at.A}</b></div>${R.at.ad.length?`<div class="mu">Absent on: ${R.at.ad.map(fd).join(', ')}</div>`:''}${R.at.ld.length?`<div class="mu">Late on: ${R.at.ld.map(fd).join(', ')}</div>`:''}</div>`;
 if(R.b&&R.b.l.length)h+=`<div class="c"><h2>Behaviour</h2><div class="t"><table>${R.b.l.map(x=>`<tr><td class="mu">${fd(x.d)}</td><td>${esc(x.t)}</td><td class="${x.v<0?'bad':'ok'}">${x.v>0?'+':''}${esc(x.v)}</td></tr>`).join('')}</table></div></div>`;
 if(R.rm&&R.rm.length)h+=`<div class="c"><h2>Teacher remarks</h2>${R.rm.map(x=>`<p><span class="mu">${fd(x.d)}</span><br>${esc(x.t)}</p>`).join('')}</div>`;
 return h||'<div class="c mu">No records for this term yet.</div>'}
function show(res){const d=res.d,ts=Object.keys(d.t);$('login').hidden=true;const r=$('rep');r.hidden=false;
 r.innerHTML=`<div class="c"><h1>${esc(d.n)}</h1><div class="mu">Class ${esc(d.g)} · ${esc(d.y)} · Updated ${fd(res.u)}</div><div class="noprint" style="margin-top:10px"><button class="g" onclick="print()">🖨️ Print / Save PDF</button> <button class="g" onclick="location.reload()">Log out</button></div></div>${ts.length?`<div class="tabs noprint">${ts.map((t,i)=>`<button data-t="${i}" class="${i==ts.length-1?'on':''}">${t}</button>`).join('')}</div><div id="tb"></div>`:'<div class="c mu">No records published yet.</div>'}`;
 if(!ts.length)return;const pick=i=>{$('tb').innerHTML=`<h2 style="margin:4px 2px 10px">${ts[i]}</h2>`+term(d.t[ts[i]]);r.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',+b.dataset.t===i))};
 r.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>pick(+b.dataset.t));pick(ts.length-1)}
$('go').onclick=async()=>{const sis=$('sis').value.trim(),code=$('code').value.replace(/[\s-]/g,'').toUpperCase(),er=$('err');er.textContent='';if(!sis||!code){er.textContent='Enter both SIS number and access code.';return}
 $('go').disabled=true;$('go').textContent='Checking…';
 try{show(await open(sis,code))}catch(e){await new Promise(r=>setTimeout(r,800));er.textContent=e.message==='nodata'?'Report data is not available yet. Please try later.':'SIS number or access code is incorrect.'}
 $('go').disabled=false;$('go').textContent='View report'};
$('code').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()});
</script></body></html>
